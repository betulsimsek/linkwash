name: Test

on:
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Rules are up to date with the catalog
        run: npm run build && git diff --exit-code rules/
      - run: npm test
      - name: End-to-end (Chrome for Testing)
        run: xvfb-run -a npm run test:e2e
