name: Update ClearURLs rules

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.bump.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run update-rules
      - id: bump
        name: Bump patch version and commit if the catalog changed
        run: |
          if git diff --quiet rules/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          node -e '
            const fs=require("fs");
            for (const f of ["manifest.json","package.json"]) {
              const j=JSON.parse(fs.readFileSync(f,"utf8"));
              const v=j.version.split(".").map(Number); v[2]++; j.version=v.join(".");
              fs.writeFileSync(f, JSON.stringify(j,null,2)+"\n");
            }'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update ClearURLs rule catalog"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  publish:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/publish.yml
    with:
      ref: main
    secrets: inherit
